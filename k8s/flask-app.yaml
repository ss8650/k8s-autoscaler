apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: k3d-mycluster-registry:51831/flask-app:latest
          ports:
            - name: http-web
              containerPort: 8080
            - name: http-metrics
              containerPort: 8000
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "1000m"
