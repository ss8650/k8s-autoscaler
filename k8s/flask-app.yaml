apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: flask-app  # no registry needed if built inside Minikube
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "1000m"
